<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test ver 3.1.0 — Design Token Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sans: "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --ink: #1c2027; --ink-2: #59606c; --ink-3: #8a909a; --line: #e6e8ec; --bg: #f7f8fa; --paper: #fff; --accent: #066AFF;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: var(--sans); color: var(--ink); background: var(--bg); font-size: 15px; line-height: 1.55; }
  header { position: sticky; top: 0; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); padding: 14px 28px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; }
  header .meta { color: var(--ink-2); font-size: 13px; }
  .layout { display: flex; align-items: flex-start; }
  #sidebar { position: sticky; top: var(--header-h, 0px); height: calc(100vh - var(--header-h, 0px)); width: 200px; flex: none; padding: 20px 12px; border-right: 1px solid var(--line); background: var(--paper); overflow-y: auto; }
  #sidebar a { display: block; padding: 7px 12px; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-size: 14px; }
  #sidebar a:hover { background: var(--bg); color: var(--ink); }
  #sidebar a.active { background: #e8f0ff; color: var(--accent); font-weight: 700; }
  main#app { flex: 1; min-width: 0; padding: 28px 36px; padding-bottom: max(120px, 100vh); }
  section.block { margin-bottom: 56px; }
  section.block > h2 { font-size: 22px; margin: 0 0 16px; scroll-margin-top: calc(var(--header-h, 0px) + 12px); }
  h3 { font-size: 15px; margin: 24px 0 10px; color: var(--ink); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .tab { border: 0; background: none; padding: 8px 14px; font: inherit; font-size: 14px; color: var(--ink-2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
  .panel[hidden] { display: none; }
  .strip { margin-bottom: 20px; }
  .strip-name { font-size: 13px; font-weight: 700; margin-bottom: 6px; text-transform: capitalize; }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
  .sw { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper); }
  .sw .chip { height: 52px; }
  .sw .lbl { padding: 5px 7px; font-family: var(--mono); font-size: 10.5px; line-height: 1.4; color: var(--ink-2); word-break: break-all; }
  .sw .lbl b { color: var(--ink); font-weight: 600; display: block; }
  .checker { background-image: linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%); background-size: 12px 12px; background-position: 0 0,0 6px,6px -6px,-6px 0; }
  table.sem-table { width: 100%; border-collapse: collapse; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
  .sem-table th { text-align: left; font-size: 12px; color: var(--ink-3); font-weight: 700; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #fafbfc; }
  .sem-table td { padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: middle; }
  .sem-table tr:last-child td { border-bottom: 0; }
  .sem-table td.name { font-family: var(--mono); font-size: 12.5px; width: 32%; }
  .val { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; }
  .val .dot { width: 28px; height: 28px; border-radius: 6px; border: 1px solid rgba(0,0,0,.08); flex: none; }
  .val .alias { color: var(--ink-2); }
  .val .hex { color: var(--ink); font-weight: 600; }
  .type-row { display: flex; gap: 20px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .type-meta { width: 230px; flex: none; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); line-height: 1.5; }
  .type-meta b { color: var(--ink); display: block; font-size: 12.5px; }
  .type-sample { min-width: 0; overflow-wrap: anywhere; }
  .pill-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .pill { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink-2); }
  .pill.on { border-color: var(--accent); background: #e8f0ff; color: var(--accent); font-weight: 700; }
  .readout { font-family: var(--mono); font-size: 13px; color: var(--ink-2); margin-bottom: 12px; }
  .gap-demo { display: flex; flex-wrap: wrap; background: var(--paper); border: 1px dashed #c9ced6; border-radius: 10px; padding: 16px; transition: gap .15s; }
  .gap-demo span { width: 56px; height: 56px; border-radius: 8px; background: #cfe0ff; border: 1px solid #9fbfff; }
  .sim-stage { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 28px; min-height: 300px; display: flex; align-items: center; justify-content: center; }
  .sim-box { background: #cfe0ff; border: 1px solid #9fbfff; transition: all .15s; }
  .vlist { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
  .vlist-row { display: flex; align-items: center; gap: 20px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .vlist-row:last-child { border-bottom: 0; }
  .vlist-demo { width: 120px; height: 72px; flex: none; border-radius: 10px; background: var(--paper); display: flex; align-items: center; justify-content: center; }
  .vlist-text { text-align: left; }
  .vlist-name { font-family: var(--mono); font-size: 13px; font-weight: 600; }
  .vlist-val { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  @media (max-width: 760px) { #sidebar { display: none; } main#app { padding: 20px; } .type-row { flex-direction: column; gap: 6px; } .type-meta { width: auto; } }
</style>
</head>

<header><h1>Test ver 3.1.0</h1><span class="meta">Design token preview · W3C DTCG · global → semantic · Mobile (pt / dp)</span></header>
<div class="layout">
  <nav id="sidebar">
    <a href="#color">Color</a>
    <a href="#typography">Typography</a>
    <a href="#spacing">Spacing</a>
    <a href="#radius">Radius</a>
    <a href="#elevation">Elevation</a>
    <a href="#border">Border</a>
    <a href="#focus-ring">Focus ring</a>
  </nav>
  <main id="app">
    <section class="block"><h2 id="color">Color</h2>
      <div class="tabs" data-group="color"><button class="tab on" data-panel="color-global">Global</button><button class="tab" data-panel="color-semantic">Semantic</button></div>
      <div class="panel" id="color-global"></div>
      <div class="panel" id="color-semantic" hidden></div>
    </section>
    <section class="block"><h2 id="typography">Typography</h2>
      <div class="tabs" data-group="type" id="type-tabs"></div>
      <div id="type-panels"></div>
    </section>
    <section class="block"><h2 id="spacing">Spacing</h2>
      <div class="pill-row" id="sp-pills"></div><div class="readout" id="sp-read"></div>
      <div class="gap-demo" id="sp-demo"></div>
    </section>
    <section class="block"><h2 id="radius">Radius</h2>
      <div class="pill-row" id="rd-pills"></div><div class="readout" id="rd-read"></div>
      <div class="sim-stage"><div class="sim-box" id="rd-box"></div></div>
    </section>
    <section class="block"><h2 id="elevation">Elevation</h2><div class="vlist" id="el-list"></div></section>
    <section class="block"><h2 id="border">Border</h2><div class="vlist" id="bw-list"></div></section>
    <section class="block"><h2 id="focus-ring">Focus ring</h2><div class="vlist" id="fr-list"></div></section>
  </main>
</div>

/* ---- Color: Semantic ---- */
function renderSemanticTable() {
  const sem = T.color.semantic, host = document.getElementById('color-semantic');
  const EMPH = ['plain', 'primary', 'secondary', 'tertiary', 'quaternary', 'solid'];
  for (const elName in sem) {
    host.appendChild(el('h3', null, elName));
    let keys = Object.keys(sem[elName]);
    if (elName === 'background') {
      const roleOf = k => k.replace(/-(plain|primary|secondary|tertiary|quaternary|solid)$/, '');
      const empOf = k => { const m = k.match(/-(plain|primary|secondary|tertiary|quaternary|solid)$/); return m ? EMPH.indexOf(m[1]) : -1; };
      const roles = []; keys.forEach(k => { const r = roleOf(k); if (!roles.includes(r)) roles.push(r); });
      keys = roles.flatMap(r => keys.filter(k => roleOf(k) === r).sort((a, b) => empOf(a) - empOf(b)));
    }
    const t = el('table', { class: 'sem-table' });
    t.appendChild(el('thead', null, '<tr><th>Name</th><th>Value</th><th>Description</th></tr>'));
    const tb = el('tbody');
    keys.forEach(k => {
      const raw = sem[elName][k].$value, v = resolve(raw);
      tb.appendChild(el('tr', null, `<td class="name">${k}</td><td><div class="val"><span class="dot" style="background:${v}"></span><span class="alias">${raw}</span><span class="hex">${v}</span></div></td><td>-</td>`));
    });
    t.appendChild(tb); host.appendChild(t);
  }
}
renderSemanticTable();

/* ---- Typography ---- */
(function renderType() {
  const sem = T.typography.semantic, LADDER = ['lightest', 'lighter', 'light', 'default', 'strong', 'stronger', 'strongest'];
  const levels = LADDER.filter(l => Object.keys(sem).some(k => k.endsWith('-' + l)));
  const SIZE = ['xs', 'sm', 'md', 'lg', 'xl', '2xl'];
  const rank = k => SIZE.indexOf(k.split('-')[1]);
  const tabs = document.getElementById('type-tabs'), panels = document.getElementById('type-panels');
  const sample = 'สวัสดีครับ ออกแบบระบบให้ใช้ง่าย The quick brown fox 0123';
  levels.forEach((lvl, i) => {
    tabs.appendChild(el('button', { class: 'tab' + (i === 0 ? ' on' : ''), 'data-panel': 'type-' + lvl }, lvl[0].toUpperCase() + lvl.slice(1)));
    const p = el('div', { class: 'panel', id: 'type-' + lvl }); if (i) p.hidden = true;
    ['headline', 'body'].forEach(fam => {
      p.appendChild(el('h3', null, fam[0].toUpperCase() + fam.slice(1)));
      Object.keys(sem).filter(k => k.startsWith(fam + '-') && k.endsWith('-' + lvl)).sort((a, b) => rank(b) - rank(a)).forEach(k => {
        const v = resolve(sem[k].$value);
        const row = el('div', { class: 'type-row' });
        row.appendChild(el('div', { class: 'type-meta' }, `<b>${k}</b>weight ${v.fontWeight} · ${v.fontSize} / ${v.lineHeight} · ${v.letterSpacing}`));
        const s = el('div', { class: 'type-sample' }, sample);
        Object.assign(s.style, { fontFamily: `"${v.fontFamily}", ${getComputedStyle(document.documentElement).getPropertyValue('--sans')}`, fontSize: v.fontSize, fontWeight: v.fontWeight, lineHeight: v.lineHeight, letterSpacing: v.letterSpacing });
        row.appendChild(s); p.appendChild(row);
      });
    });
    panels.appendChild(p);
  });
  bindTabs(tabs);
})();

/* ---- Spacing / Radius simulators ---- */
function pills(hostId, map, onPick, initial) {
  const host = document.getElementById(hostId);
  Object.keys(map).forEach(k => {
    const b = el('button', { class: 'pill' + (k === initial ? ' on' : '') }, k);
    b.addEventListener('click', () => { host.querySelectorAll('.pill').forEach(x => x.classList.toggle('on', x === b)); onPick(k); });
    host.appendChild(b);
  });
  onPick(initial);
}
const spDemo = document.getElementById('sp-demo');
for (let i = 0; i < 6; i++) spDemo.appendChild(el('span'));
pills('sp-pills', T.spacing.semantic, k => {
  const raw = T.spacing.semantic[k].$value, v = resolve(raw);
  spDemo.style.gap = v; document.getElementById('sp-read').textContent = `spacing.semantic.${k} → ${raw} → ${v}`;
}, 'md');
function boxSizeFor(radiusPx) { return Math.min(240, Math.max(96, radiusPx * 3 + 40)); }
const rdBox = document.getElementById('rd-box');
pills('rd-pills', T.radius.semantic, k => {
  const raw = T.radius.semantic[k].$value, v = resolve(raw), px = parseFloat(v);
  if (k === 'full') { rdBox.style.width = '160px'; rdBox.style.height = '56px'; }
  else { const s = boxSizeFor(px) + 'px'; rdBox.style.width = s; rdBox.style.height = s; }
  rdBox.style.borderRadius = v; document.getElementById('rd-read').textContent = `radius.semantic.${k} → ${raw} → ${v}`;
}, 'md');

/* ---- Elevation / Border / Focus ring (.vlist) ---- */
function vrow(host, name, valText, styleFn) {
  const r = el('div', { class: 'vlist-row' }), d = el('div', { class: 'vlist-demo' });
  styleFn(d); r.appendChild(d);
  r.appendChild(el('div', { class: 'vlist-text' }, `<div class="vlist-name">${name}</div><div class="vlist-val">${valText}</div>`));
  host.appendChild(r);
}
const elList = document.getElementById('el-list');
for (const k in T.elevation.semantic) {
  const raw = T.elevation.semantic[k].$value, v = resolve(raw);
  const css = `${v.offsetX} ${v.offsetY} ${v.blur} ${v.spread} ${v.color}`;
  vrow(elList, 'elevation.semantic.' + k, `${raw} → ${css}`, d => { d.style.boxShadow = css; d.style.border = '1px solid #eef0f3'; });
}
const bwList = document.getElementById('bw-list');
for (const k in T.border.semantic) {
  const raw = T.border.semantic[k].$value, v = resolve(raw);
  vrow(bwList, 'border.semantic.' + k, `${raw} → ${v}`, d => { d.style.border = `${v} solid ${resolve('{color.semantic.border.base-primary}')}`; });
}
const frList = document.getElementById('fr-list');
for (const k in T.color.semantic.focus_ring) {
  const raw = T.color.semantic.focus_ring[k].$value, v = resolve(raw);
  vrow(frList, 'color.semantic.focus_ring.' + k, `${raw} → ${v}`, d => { d.style.border = '1px solid #d5d9df'; d.style.outline = `3px solid ${v}`; d.style.outlineOffset = '2px'; });
}

/* ---- Sidebar scroll-spy ---- */
(function initSidebar() {
  const links = [...document.querySelectorAll('#sidebar a')];
  const heads = links.map(a => document.getElementById(a.getAttribute('href').slice(1)));
  const visible = new Set(); let suppress = false, timer = null;
  const setActive = a => links.forEach(l => l.classList.toggle('active', l === a));
  const pickTop = () => { if (suppress) return; const idx = heads.map((h, i) => visible.has(h) ? i : -1).filter(i => i >= 0); if (idx.length) setActive(links[Math.min(...idx)]); };
  const io = new IntersectionObserver(es => { es.forEach(e => e.isIntersecting ? visible.add(e.target) : visible.delete(e.target)); pickTop(); },
    { rootMargin: `-${(document.querySelector('header').offsetHeight + 10)}px 0px -60% 0px` });
  heads.forEach(h => io.observe(h));
  const release = () => { suppress = false; clearTimeout(timer); };
  links.forEach((a, i) => a.addEventListener('click', e => {
    e.preventDefault(); setActive(a); suppress = true; clearTimeout(timer); timer = setTimeout(release, 600);
    heads[i].scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));
  window.addEventListener('scrollend', release);
  window.addEventListener('scroll', () => {
    if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 2) setActive(links[links.length - 1]);
    else if (window.scrollY <= 2) setActive(links[0]);
  }, { passive: true });
  setActive(links[0]);
})();
</script>
